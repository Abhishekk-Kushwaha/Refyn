<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='72' font-size='62' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'>R</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080c" />
    <title>REFYN — Hunt your weakness</title>

    <!-- Prevent theme flash. Validated against the known themes: an unknown
         value matches no [data-theme] block and renders the app with no
         tokens at all. -->
    <script>
      (function() {
        var stored = localStorage.getItem('refyn-theme');
        var theme = ['dark', 'light', 'warm'].indexOf(stored) !== -1 ? stored : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <!-- Google Fonts with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
